name: CI

on:
  push:
    branches: [main, 'template/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  template:
    name: Generate app and validate (types, lint, tests, bundles)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bash scripts/test-template.sh "$RUNNER_TEMP/template-test"

  android:
    name: Generate app and build Android (debug)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: template
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: bash scripts/test-template.sh "$RUNNER_TEMP/template-test"
        env:
          ANDROID_BUILD: '1'
